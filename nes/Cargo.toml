[package]
name = "nes"
version = "0.1.0"
edition = "2021"
default-run = "nes"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]

log_memory = []
log_to_file = []
log_disk = []
log_prodos = []
minifb = []

[dev-dependencies]

test-case = "3.3.1"

[dependencies]

cpu = { path = "../cpu" }
tokio = {  version = "1.38.0", features = [ "macros", "sync", "rt-multi-thread" ] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json", "env-filter"] }
tracing-appender = "0.2.3"
rolling-file = "0.2.0"
rayon = "1.10.0"
fast_image_resize = "6.0.0"
once_cell = "1.19.0"
clap = { version = "4.5.4", features = ["derive"] }
walkdir = "2.5.0"
rand = "0.10.1"
dirs = "6.0.0"
serde = { version = "1.0.219", features = ["derive" ] }
serde_json = "1.0.128"
enum_dispatch = "0.3.13"
rodio = "0.22.2"
crossbeam-queue = "0.3.12"
gilrs = "0.11.1"
zip = "8.6.0"
base64 = "0.22.1"
md5 = "0.8.0"
minifb = "0.28.0"
vizia = {
    git = "https://github.com/vizia/vizia",
    rev = "cdfcedd5656c3eae99c6d27ecf8ae899de3f21e2",
    version = "0.4.0",
    features = ["winit"]
}
